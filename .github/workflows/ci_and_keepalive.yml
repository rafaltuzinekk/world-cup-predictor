name: CI and Keep-Alive

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *" # co 12 godzin (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-check:
    name: CI Pipeline Check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data + Elo + model + bracket + Monte Carlo pipeline
        run: python -m src.run_pipeline

      - name: Verify pipeline artifacts
        run: |
          test -s data/world_cup.duckdb
          test -s data/processed/current_elo_ratings.csv
          test -s data/processed/monte_carlo_results.csv

      - name: Smoke-test the Streamlit app (headless)
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py", default_timeout=180).run()
          assert not at.exception, [e.value for e in at.exception]
          print("app.py rendered without exceptions")
          PY

  keep-alive:
    name: Keep Streamlit app awake
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit Cloud deployment
        run: |
          curl -sS -L --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
            --max-redirs 10 --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://world-cup-predictor-rt.streamlit.app/" > /dev/null || true
          echo "Keep-alive ping completed successfully."
